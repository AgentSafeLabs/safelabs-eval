[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safelabs-eval"
version = "0.2.0"
description = "OWASP-aligned red-teaming and evaluation framework for AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Waqar Javed", email = "waqar@agentsafelabs.io" },
]
keywords = [
    "ai-safety", "red-teaming", "llm", "agents",
    "owasp", "evaluation", "prompt-injection", "jailbreak",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.25",
    "click>=8.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
autogen = ["ag2>=0.2"]
crewai = ["crewai>=0.30"]
llamaindex = ["llama-index-core>=0.11"]
openai-agents = ["openai-agents>=0.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "hatchling",
]

[project.scripts]
safelabs = "safelabs.cli:main"

[project.urls]
Homepage = "https://github.com/AgentSafeLabs/safelabs-eval"
Documentation = "https://github.com/AgentSafeLabs/safelabs-eval#readme"
"Bug Tracker" = "https://github.com/AgentSafeLabs/safelabs-eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["safelabs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
